<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MsgDrop — Long Messages, One Tap</title>
<meta property="og:title" content="📩 Hey! Read my message here">
<meta property="og:description" content="Tap to open the full message — it was too long for chat!">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MsgDrop">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="📩 Hey! Read my message here">
<meta name="twitter:description" content="Tap to open the full message — it was too long for chat!">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  [data-theme="dark"] {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242837;
    --accent: #6ee7b7; --accent2: #34d399;
    --accent-glow: rgba(110, 231, 183, 0.15);
    --text: #e8eaf0; --text2: #9ca3b4; --text-inv: #1a1d27;
    --radius: 14px; --toggle-bg: #242837; --toggle-knob: #6ee7b7;
    --noise-opacity: 0.03; --card-shadow: 0 4px 24px rgba(0,0,0,0.3);
    --gradient-top: rgba(110,231,183,0.05);
  }
  [data-theme="light"] {
    --bg: #f4f2ee; --surface: #ffffff; --surface2: #e8e5df;
    --accent: #0d9668; --accent2: #10b981;
    --accent-glow: rgba(13, 150, 104, 0.1);
    --text: #1a1a1a; --text2: #6b7280; --text-inv: #ffffff;
    --radius: 14px; --toggle-bg: #e8e5df; --toggle-knob: #0d9668;
    --noise-opacity: 0.015; --card-shadow: 0 4px 24px rgba(0,0,0,0.06);
    --gradient-top: rgba(13, 150, 104, 0.04);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.6;
    transition: background 0.4s ease, color 0.3s ease;
  }
  .noise {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }
  .container {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto; padding: 40px 20px 60px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #3b82f6);
    border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .logo-text {
    font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #93c5fd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .theme-toggle {
    position: relative; width: 56px; height: 30px;
    background: var(--toggle-bg); border-radius: 50px;
    border: none; cursor: pointer; transition: background 0.3s; overflow: hidden;
  }
  .theme-toggle::before {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; background: var(--toggle-knob); border-radius: 50%;
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background 0.3s; z-index: 2;
  }
  [data-theme="light"] .theme-toggle::before { transform: translateX(26px); }
  .toggle-icons {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 0 7px; font-size: 13px; z-index: 1; pointer-events: none;
  }
  .tagline { color: var(--text2); font-size: 14px; margin-bottom: 36px; }
  .field-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--accent); margin-bottom: 8px;
  }
  input[type="text"], textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--surface2);
    border-radius: var(--radius); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 16px; padding: 14px 18px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input::placeholder, textarea::placeholder { color: var(--text2); }
  .title-input { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
  textarea { min-height: 260px; resize: vertical; line-height: 1.7; }
  .char-count { text-align: right; font-size: 12px; color: var(--text2); margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: var(--text-inv); font-weight: 700; font-size: 15px;
    border: none; border-radius: var(--radius); padding: 16px 32px; cursor: pointer;
    width: 100%; margin-top: 24px; transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-glow); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .result { display: none; margin-top: 28px; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .result-box {
    background: var(--surface); border: 1px solid var(--surface2);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--card-shadow);
  }
  .result-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--accent); margin-bottom: 10px;
  }
  .result-links { display: flex; flex-direction: column; gap: 10px; }
  .link-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); padding: 12px 14px; border-radius: 10px;
  }
  .link-row .label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text2); min-width: 50px;
  }
  .link-row .url { flex: 1; font-size: 15px; color: var(--accent); font-weight: 600; word-break: break-all; }
  .link-row .url.long-url { font-size: 11px; color: var(--text2); font-weight: 400; max-height: 40px; overflow: hidden; }
  .link-row .url.short-loading { color: var(--text2); font-style: italic; font-weight: 400; }
  .link-row .url.short-error { color: #f87171; font-size: 12px; font-weight: 400; }
  .copy-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-sm {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
    cursor: pointer; border: none; transition: transform 0.12s;
  }
  .btn-sm:hover { transform: translateY(-1px); }
  .btn-copy { background: var(--surface2); color: var(--text); }
  .btn-wa { background: #25d366; color: #fff; }
  .wa-preview {
    margin-top: 20px; background: var(--surface); border: 1px solid var(--surface2);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--card-shadow);
  }
  .wa-preview-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text2); margin-bottom: 10px;
  }
  .wa-preview-text { font-size: 15px; color: var(--text); white-space: pre-wrap; line-height: 1.6; }
  .wa-preview-text .wa-link { color: #93c5fd; text-decoration: underline; }
  [data-theme="light"] .wa-preview-text .wa-link { color: #2563eb; }

  /* Read Mode */
  .read-view { display: none; }
  .read-card {
    background: var(--surface); border: 1px solid var(--surface2); border-radius: 18px;
    overflow: hidden; animation: fadeUp 0.5s ease; box-shadow: var(--card-shadow);
  }
  .read-header {
    padding: 32px 28px 24px; border-bottom: 1px solid var(--surface2);
    background: linear-gradient(180deg, var(--gradient-top) 0%, transparent 100%);
  }
  .read-title { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .read-meta { font-size: 13px; color: var(--text2); }
  .read-body { padding: 28px; font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
  .read-body strong { color: var(--accent); font-weight: 600; }
  .read-player {
    padding: 16px 28px; border-top: 1px solid var(--surface2);
    display: flex; align-items: center; gap: 12px;
  }
  .btn-listen {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface2); color: var(--text);
    border: none; border-radius: 50px;
    padding: 10px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.12s, background 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-listen:hover { transform: translateY(-1px); background: var(--accent); color: var(--text-inv); }
  .btn-listen.playing { background: var(--accent); color: var(--text-inv); }
  .tts-speed {
    background: var(--bg); border: 1px solid var(--surface2);
    color: var(--text2); border-radius: 50px;
    padding: 6px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
  }
  .tts-speed:hover { border-color: var(--accent); }
  .tts-progress {
    flex: 1; height: 3px; background: var(--surface2); border-radius: 3px; overflow: hidden;
  }
  .tts-progress-bar {
    height: 100%; width: 0%; background: var(--accent);
    border-radius: 3px; transition: width 0.3s;
  }
  .read-footer {
    padding: 20px 28px; border-top: 1px solid var(--surface2);
    text-align: center; font-size: 12px; color: var(--text2);
  }
  .read-footer a { color: var(--accent); text-decoration: none; cursor: pointer; }
  .compose-view { display: block; }
  @media (max-width: 480px) {
    .container { padding: 24px 16px 40px; }
    .read-header { padding: 24px 20px 20px; }
    .read-body { padding: 20px; }
    .read-title { font-size: 22px; }
    .read-player { padding: 14px 20px; }
    .link-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    .link-row .label { min-width: auto; }
  }
</style>
</head>
<body>
<div class="noise"></div>
<div class="container">

  <!-- COMPOSE VIEW -->
  <div class="compose-view" id="composeView">
    <div class="header-row">
      <div class="logo"><div class="logo-icon">💧</div><div class="logo-text">MsgDrop</div></div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="toggle-icons"><span>🌙</span><span>☀️</span></span>
      </button>
    </div>
    <div class="tagline">Write a long message. Share a short link. No server, no signup.</div>
    <div class="field-label">Title</div>
    <input type="text" class="title-input" id="msgTitle" placeholder="e.g. Meeting notes for Monday">
    <div class="field-label" style="margin-top:20px">Message</div>
    <textarea id="msgBody" placeholder="Write your full message here...

Supports **bold** text and line breaks."></textarea>
    <div class="char-count"><span id="charCount">0</span> chars</div>
    <button class="btn" id="generateBtn" onclick="generate()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Generate Link
    </button>
    <div class="result" id="result">
      <div class="result-box">
        <div class="result-label">Your links</div>
        <div class="result-links">
          <div class="link-row">
            <span class="label">Short</span><span class="url" id="shortUrl"></span>
          </div>
          <div class="link-row">
            <span class="label">Full</span><span class="url long-url" id="fullUrl"></span>
          </div>
        </div>
        <div class="copy-row">
          <button class="btn-sm btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Short Link</button>
          <button class="btn-sm btn-wa" onclick="shareWhatsApp()">💬 WhatsApp</button>
        </div>
      </div>
      <div class="wa-preview">
        <div class="wa-preview-label">WhatsApp preview</div>
        <div class="wa-preview-text" id="waPreview"></div>
      </div>
    </div>
  </div>

  <!-- READ VIEW -->
  <div class="read-view" id="readView">
    <div class="header-row" style="margin-bottom:24px">
      <div class="logo"><div class="logo-icon">💧</div><div class="logo-text">MsgDrop</div></div>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="toggle-icons"><span>🌙</span><span>☀️</span></span>
      </button>
    </div>
    <div class="read-card">
      <div class="read-header">
        <div class="read-title" id="readTitle"></div>
        <div class="read-meta" id="readMeta"></div>
      </div>
      <div class="read-body" id="readBody"></div>
      <div class="read-player">
        <button class="btn-listen" id="listenBtn" onclick="toggleTTS()">
          <span id="listenIcon">🔊</span> <span id="listenLabel">Listen</span>
        </button>
        <div class="tts-progress" id="ttsProgress" style="display:none">
          <div class="tts-progress-bar" id="ttsBar"></div>
        </div>
        <button class="tts-speed" id="speedBtn" onclick="cycleSpeed()">1×</button>
      </div>
      <div class="read-footer">Shared via <a onclick="goCompose()">MsgDrop</a> — send long messages as links</div>
    </div>
  </div>

</div>

<script>
const VERSION = 1;

// ─── Theme ──────────────────────────────────────────
let currentTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
}

// ─── Encoding ───────────────────────────────────────
function encodeMessage(title, body) {
  return LZString.compressToEncodedURIComponent(
    JSON.stringify({ v: VERSION, t: title, b: body, d: Date.now() })
  );
}

function decodeMessage(data) {
  try {
    const json = LZString.decompressFromEncodedURIComponent(data);
    if (!json) return null;
    return JSON.parse(json);
  } catch(e) { return null; }
}

function renderText(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// ─── URL Shortener ──────────────────────────────────
async function shortenUrl(longUrl) {
  var services = [
    'https://is.gd/create.php?format=json&url=' + encodeURIComponent(longUrl),
    'https://v.gd/create.php?format=json&url=' + encodeURIComponent(longUrl)
  ];
  for (var i = 0; i < services.length; i++) {
    try {
      var res = await fetch(services[i]);
      var data = await res.json();
      if (data.shorturl) return data.shorturl;
    } catch(e) { continue; }
  }
  return null;
}

// ─── Compose ────────────────────────────────────────
var msgBody = document.getElementById('msgBody');
var charCount = document.getElementById('charCount');
msgBody.addEventListener('input', function() { charCount.textContent = msgBody.value.length; });

var shareUrl = '';
var fullUrl = '';

async function generate() {
  var title = document.getElementById('msgTitle').value.trim();
  var body = msgBody.value.trim();
  if (!body) { msgBody.focus(); return; }

  document.getElementById('generateBtn').disabled = true;

  var hash = encodeMessage(title || 'Message', body);
  var base = window.location.origin + window.location.pathname;
  fullUrl = base + '#' + hash;
  shareUrl = fullUrl;

  document.getElementById('fullUrl').textContent = fullUrl;
  document.getElementById('shortUrl').textContent = 'Shortening...';
  document.getElementById('shortUrl').className = 'url short-loading';
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  updateWaPreview(title, body, shareUrl);

  try {
    var short = await shortenUrl(fullUrl);
    if (short) {
      shareUrl = short;
      document.getElementById('shortUrl').textContent = short;
      document.getElementById('shortUrl').className = 'url';
      updateWaPreview(title, body, short);
    } else {
      shortenerFailed();
    }
  } catch(e) {
    shortenerFailed();
  }

  document.getElementById('generateBtn').disabled = false;
}

function shortenerFailed() {
  document.getElementById('shortUrl').textContent = 'Shortener unavailable \u2014 use full link';
  document.getElementById('shortUrl').className = 'url short-error';
  document.getElementById('copyBtn').textContent = '\uD83D\uDCCB Copy Full Link';
}

function updateWaPreview(title, body, url) {
  var displayTitle = title || 'Message';
  var preview = body.length > 140 ? body.substring(0, 140) + '\u2026' : body;
  document.getElementById('waPreview').innerHTML =
    '\uD83D\uDCE9 <strong>' + renderText(displayTitle) + '</strong>\n\n' +
    renderText(preview) + '\n\n' +
    '\uD83D\uDC49 <span class="wa-link">' + url + '</span>';
}

function copyLink() {
  navigator.clipboard.writeText(shareUrl).then(function() {
    var btn = document.getElementById('copyBtn');
    var orig = btn.textContent;
    btn.textContent = '\u2713 Copied!';
    setTimeout(function() { btn.textContent = orig; }, 1500);
  });
}

function shareWhatsApp() {
  var title = document.getElementById('msgTitle').value.trim() || 'Message';
  var body = msgBody.value.trim();
  var preview = body.length > 140 ? body.substring(0, 140) + '\u2026' : body;
  var text = '\uD83D\uDCE9 *' + title + '*\n\n' + preview + '\n\n\uD83D\uDC49 ' + shareUrl;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

// ─── TTS ────────────────────────────────────────────
var ttsText = '';
var ttsPlaying = false;
var ttsSpeed = 1;
var speeds = [1, 1.25, 1.5, 0.75];
var speedIndex = 0;

function detectLanguage(text) {
  var s = text.substring(0, 800).toLowerCase();
  var patterns = [
    ['it-IT', /\b(che|è|dell[ao]|sono|con|una|questo|quello|già|perché|anche|essere|hanno|stato|come|più|tutto|fare|dopo|ancora)\b/g],
    ['es-ES', /\b(que|está|para|como|pero|también|puede|tiene|esto|sobre|cuando|todos|entre|porque|desde|donde|antes|después)\b/g],
    ['pt-BR', /\b(que|está|para|como|também|pode|isso|não|uma|mais|quando|muito|ainda|aqui|foram|fazer|pelos|estas)\b/g],
    ['fr-FR', /\b(que|est|pour|les|des|une|avec|dans|cette|sont|nous|vous|mais|tout|plus|leur|fait|être|même|aussi)\b/g],
    ['de-DE', /\b(und|der|die|das|ist|für|mit|auf|ein|nicht|sich|auch|wird|oder|nach|noch|bei|kann|aber|wenn)\b/g],
    ['nl-NL', /\b(het|een|van|dat|die|niet|zijn|voor|met|ook|maar|deze|werd|nog|wel|naar|zij|wat|bij|uit)\b/g],
    ['pl-PL', /\b(jest|nie|się|jak|ale|czy|tego|już|tak|tylko|był|może|będzie|bardzo|przez|przed|jeszcze)\b/g],
    ['ru-RU', /[а-яё]{3,}/g],
    ['uk-UA', /\b(що|як|але|від|або|для|його|вона|цей|після|були|може|також|якщо|ще|між|під|без)\b/g],
    ['ja-JP', /[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf]/g],
    ['ko-KR', /[\uac00-\ud7af\u1100-\u11ff]/g],
    ['zh-CN', /[\u4e00-\u9fff]/g],
    ['ar-SA', /[\u0600-\u06ff]/g],
    ['hi-IN', /[\u0900-\u097f]/g],
    ['th-TH', /[\u0e00-\u0e7f]/g],
    ['vi-VN', /[àáảãạăắằẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđ]/g],
    ['tr-TR', /\b(bir|bu|ile|için|olan|gibi|daha|çok|sonra|kadar|olarak|ancak|ise|veya|aynı|hem)\b/g],
    ['sv-SE', /\b(och|det|att|som|för|med|den|inte|har|var|från|kan|till|vid|utan|efter|alla|där|mycket)\b/g],
    ['da-DK', /\b(og|det|at|som|for|med|den|ikke|har|var|fra|kan|til|ved|efter|alle|der|meget|igen)\b/g],
    ['nb-NO', /\b(og|det|som|for|med|ikke|har|kan|fra|til|etter|alle|også|bare|eller|når|noen|denne)\b/g],
    ['fi-FI', /\b(ja|on|ei|se|kun|niin|ole|oli|ovat|myös|mutta|vain|nyt|kuin|joka|olla|yli|joten)\b/g],
    ['el-GR', /[\u0370-\u03ff]/g],
    ['he-IL', /[\u0590-\u05ff]/g],
    ['ro-RO', /\b(este|sunt|care|din|sau|acest|pentru|mai|fost|prin|când|doar|fiind|după|între|fără)\b/g],
    ['cs-CZ', /\b(jest|není|jsou|být|jako|ale|když|také|nebo|jeho|ještě|může|bylo|před|další|velmi)\b/g],
    ['hu-HU', /\b(egy|hogy|nem|van|volt|meg|még|csak|vagy|mint|már|azt|lett|után|között|minden)\b/g],
    ['id-ID', /\b(yang|dan|dari|untuk|dengan|pada|adalah|ini|tidak|akan|juga|atau|itu|ke|dalam|ada)\b/g]
  ];

  var best = 'en-US';
  var bestScore = 0;

  for (var i = 0; i < patterns.length; i++) {
    var matches = s.match(patterns[i][1]);
    var score = matches ? matches.length : 0;
    if (score > bestScore) {
      bestScore = score;
      best = patterns[i][0];
    }
  }

  return bestScore >= 3 ? best : 'en-US';
}

function getBestVoice(lang) {
  var voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  var prefix = lang.substring(0, 2);

  // Get all voices matching the target language
  var langVoices = voices.filter(function(v) { return v.lang.startsWith(prefix); });

  if (langVoices.length > 0) {
    // Prefer neural/natural/enhanced voices
    var neural = langVoices.find(function(v) { return /natural|neural|online|enhanced|premium/i.test(v.name); });
    if (neural) return neural;
    // Prefer non-compact voices
    var quality = langVoices.find(function(v) { return !/compact/i.test(v.name); });
    if (quality) return quality;
    return langVoices[0];
  }

  // Fallback: try English, never return a random voice
  if (prefix !== 'en') {
    var enVoices = voices.filter(function(v) { return v.lang.startsWith('en'); });
    if (enVoices.length > 0) {
      var enNeural = enVoices.find(function(v) { return /natural|neural|online|enhanced|premium/i.test(v.name); });
      return enNeural || enVoices[0];
    }
  }

  return null;
}

function toggleTTS() {
  if (ttsPlaying) {
    speechSynthesis.cancel();
    ttsPlaying = false;
    updateTTSUI();
    return;
  }

  if (!ttsText) return;

  // Ensure voices are loaded before speaking
  var voices = speechSynthesis.getVoices();
  if (!voices.length) {
    // Voices not loaded yet — wait and retry
    speechSynthesis.onvoiceschanged = function() {
      speechSynthesis.onvoiceschanged = null;
      startSpeaking();
    };
    // Also try after a short delay as fallback
    setTimeout(function() { if (!ttsPlaying) startSpeaking(); }, 300);
    return;
  }

  startSpeaking();
}

function startSpeaking() {
  speechSynthesis.cancel();
  var lang = detectLanguage(ttsText);

  var utterance = new SpeechSynthesisUtterance(ttsText);
  utterance.lang = lang;
  utterance.rate = ttsSpeed;

  var voice = getBestVoice(lang);
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang; // Ensure lang matches the actual voice
  }

  var words = ttsText.split(/\s+/).length;
  var estimatedDuration = (words / 150) * 60 / ttsSpeed;
  var startTime;

  utterance.onstart = function() {
    ttsPlaying = true;
    startTime = Date.now();
    document.getElementById('ttsProgress').style.display = 'block';
    updateTTSUI();
    updateProgress(startTime, estimatedDuration);
  };

  utterance.onend = function() {
    ttsPlaying = false;
    document.getElementById('ttsBar').style.width = '100%';
    setTimeout(function() {
      document.getElementById('ttsBar').style.width = '0%';
      document.getElementById('ttsProgress').style.display = 'none';
      updateTTSUI();
    }, 500);
  };

  utterance.onerror = function() {
    ttsPlaying = false;
    updateTTSUI();
  };

  speechSynthesis.speak(utterance);
}

function updateProgress(startTime, duration) {
  if (!ttsPlaying) return;
  var elapsed = (Date.now() - startTime) / 1000;
  var pct = Math.min((elapsed / duration) * 100, 95);
  document.getElementById('ttsBar').style.width = pct + '%';
  requestAnimationFrame(function() { updateProgress(startTime, duration); });
}

function updateTTSUI() {
  var btn = document.getElementById('listenBtn');
  var icon = document.getElementById('listenIcon');
  var label = document.getElementById('listenLabel');
  if (ttsPlaying) {
    btn.classList.add('playing');
    icon.textContent = '\u23F9';
    label.textContent = 'Stop';
  } else {
    btn.classList.remove('playing');
    icon.textContent = '\uD83D\uDD0A';
    label.textContent = 'Listen';
  }
}

function cycleSpeed() {
  speedIndex = (speedIndex + 1) % speeds.length;
  ttsSpeed = speeds[speedIndex];
  document.getElementById('speedBtn').textContent = ttsSpeed + '\u00D7';
  if (ttsPlaying) {
    speechSynthesis.cancel();
    ttsPlaying = false;
    toggleTTS();
  }
}

// Preload voices
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
}

// ─── Read Mode ──────────────────────────────────────
function showRead(data) {
  document.getElementById('composeView').style.display = 'none';
  document.getElementById('readView').style.display = 'block';
  document.getElementById('readTitle').textContent = data.t;
  document.getElementById('readBody').innerHTML = renderText(data.b);
  ttsText = data.b.replace(/\*\*/g, '');

  if (data.d) {
    var date = new Date(data.d);
    document.getElementById('readMeta').textContent =
      date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  document.title = data.t + ' \u2014 MsgDrop';
}

function goCompose() {
  history.pushState(null, '', window.location.pathname);
  document.getElementById('composeView').style.display = 'block';
  document.getElementById('readView').style.display = 'none';
  document.title = 'MsgDrop \u2014 Long Messages, One Tap';
}

// ─── Init ───────────────────────────────────────────
function init() {
  var hash = window.location.hash.substring(1);
  if (hash) {
    var data = decodeMessage(hash);
    if (data) { showRead(data); return; }
  }
}

window.addEventListener('hashchange', init);
init();
</script>

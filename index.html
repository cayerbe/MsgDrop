<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulissy Drop — Long Messages, One Tap</title>
  <meta property="og:title" content="📩 Hey! Read my message here">
  <meta property="og:description" content="Tap to open the full message — it was too long for chat!">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ulissy Drop">
  <meta property="og:image" content="https://cayerbe.github.io/ulissy-drop/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="📩 Hey! Read my message here">
  <meta name="twitter:description" content="Tap to open the full message — it was too long for chat!">
  <meta name="twitter:image" content="https://cayerbe.github.io/ulissy-drop/og-image.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    [data-theme="dark"] {
      --bg: #0a1214;
      --surface: #0f1a1c;
      --surface2: #1a2a2d;
      --accent: #21CEE3;
      --accent2: #1AB8CC;
      --accent-glow: rgba(33, 206, 227, 0.2);
      --text: #e8f4f5;
      --text2: #8ab4ba;
      --text-inv: #0a1214;
      --radius: 14px;
      --toggle-bg: #1a2a2d;
      --toggle-knob: #21CEE3;
      --noise-opacity: 0.03;
      --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --gradient-top: rgba(33, 206, 227, 0.08);
    }

    [data-theme="light"] {
      --bg: #f0f9fa;
      --surface: #ffffff;
      --surface2: #e0f2f4;
      --accent: #1AB8CC;
      --accent2: #21CEE3;
      --accent-glow: rgba(33, 206, 227, 0.15);
      --text: #0a1214;
      --text2: #4a7a82;
      --text-inv: #ffffff;
      --radius: 14px;
      --toggle-bg: #e0f2f4;
      --toggle-knob: #1AB8CC;
      --noise-opacity: 0.015;
      --card-shadow: 0 4px 24px rgba(33, 206, 227, 0.1);
      --gradient-top: rgba(33, 206, 227, 0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.4s ease, color 0.3s ease;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: var(--noise-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: var(--accent);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .logo-icon svg {
      width: 100%;
      height: 100%;
      fill: white;
    }

    .logo-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--text2);
      font-weight: 500;
    }

    .theme-toggle {
      position: relative;
      width: 56px;
      height: 30px;
      background: var(--toggle-bg);
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
      overflow: hidden;
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      background: var(--toggle-knob);
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
      z-index: 2;
    }

    [data-theme="light"] .theme-toggle::before {
      transform: translateX(26px);
    }

    .toggle-icons {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7px;
      font-size: 13px;
      z-index: 1;
      pointer-events: none;
    }

    .tagline {
      color: var(--text2);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: var(--surface);
      border: 2px solid var(--surface2);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text2);
    }

    .title-input {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 1.7;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text2);
      margin-top: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: var(--text-inv);
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: var(--radius);
      padding: 16px 32px;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    .btn:hover {
      background: var(--accent2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .result {
      display: none;
      margin-top: 28px;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-box {
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
    }

    .result-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .result-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .link-row .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      min-width: 50px;
    }

    .link-row .url {
      flex: 1;
      font-size: 15px;
      color: var(--accent);
      font-weight: 600;
      word-break: break-all;
    }

    .link-row .url.long-url {
      font-size: 11px;
      color: var(--text2);
      font-weight: 400;
      max-height: 40px;
      overflow: hidden;
    }

    .link-row .url.short-loading {
      color: var(--text2);
      font-style: italic;
      font-weight: 400;
    }

    .link-row .url.short-error {
      color: #f87171;
      font-size: 12px;
      font-weight: 400;
    }

    .copy-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-sm {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: transform 0.12s;
    }

    .btn-sm:hover {
      transform: translateY(-1px);
    }

    .btn-copy {
      background: var(--surface2);
      color: var(--text);
    }

    .btn-wa {
      background: #25d366;
      color: #fff;
    }

    .wa-preview {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
    }

    .wa-preview-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text2);
      margin-bottom: 10px;
    }

    .wa-preview-text {
      font-size: 15px;
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .wa-preview-text .wa-link {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Read Mode */
    .read-view {
      display: none;
    }

    .read-card {
      background: var(--surface);
      border: 1px solid var(--surface2);
      border-radius: 18px;
      overflow: hidden;
      animation: fadeUp 0.5s ease;
      box-shadow: var(--card-shadow);
    }

    .read-header {
      padding: 32px 28px 24px;
      border-bottom: 1px solid var(--surface2);
      background: linear-gradient(180deg, var(--gradient-top) 0%, transparent 100%);
    }

    .read-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .read-meta {
      font-size: 13px;
      color: var(--text2);
    }

    .read-body {
      padding: 28px;
      font-size: 16px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .read-body strong {
      color: var(--accent);
      font-weight: 600;
    }

    .read-player {
      padding: 16px 28px;
      border-top: 1px solid var(--surface2);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-listen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      color: var(--text);
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-listen:hover {
      transform: translateY(-1px);
      background: var(--accent);
      color: var(--text-inv);
    }

    .btn-listen.playing {
      background: var(--accent);
      color: var(--text-inv);
    }

    .tts-speed {
      background: var(--bg);
      border: 1px solid var(--surface2);
      color: var(--text2);
      border-radius: 50px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.2s;
    }

    .tts-speed:hover {
      border-color: var(--accent);
    }

    .tts-progress {
      flex: 1;
      height: 3px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
    }

    .tts-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }

    .read-likes {
      padding: 16px 28px;
      border-top: 1px solid var(--surface2);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-like {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      color: var(--text2);
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, color 0.2s;
      font-family: 'DM Sans', sans-serif;
      user-select: none;
    }

    .btn-like:hover {
      transform: translateY(-1px);
    }

    .btn-like.liked {
      background: #fecdd3;
      color: #e11d48;
    }

    [data-theme="dark"] .btn-like.liked {
      background: rgba(225, 29, 72, 0.15);
      color: #fb7185;
    }

    .btn-like .heart {
      display: inline-block;
      font-size: 18px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-like.liked .heart {
      transform: scale(1.3);
    }

    .like-count {
      font-size: 14px;
      color: var(--text2);
      font-weight: 500;
    }

    @keyframes heartPop {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(1.5);
      }

      100% {
        transform: scale(1.3);
      }
    }

    .heart-pop .heart {
      animation: heartPop 0.4s ease;
    }

    .read-footer {
      padding: 20px 28px;
      border-top: 1px solid var(--surface2);
      text-align: center;
      font-size: 12px;
      color: var(--text2);
    }

    .read-footer a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .compose-view {
      display: block;
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 16px 40px;
      }

      .read-header {
        padding: 24px 20px 20px;
      }

      .read-body {
        padding: 20px;
      }

      .read-title {
        font-size: 22px;
      }

      .read-player {
        padding: 14px 20px;
      }

      .read-likes {
        padding: 14px 20px;
      }

      .link-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .link-row .label {
        min-width: auto;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="container">

    <!-- COMPOSE VIEW -->
    <div class="compose-view" id="composeView">
      <div class="header-row">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="M50 8 L50 55 L78 55 Q80 30 62 15 Q52 8 50 8Z" fill="white" />
              <rect x="48" y="2" width="4" height="56" fill="white" rx="2" />
              <path d="M12 58 Q8 58 12 64 L22 68 L78 68 L88 64 Q92 58 88 58 L12 58Z" fill="white" />
              <path d="M12 58 Q5 54 10 45 Q12 50 16 55" fill="white" />
              <path d="M2 78 Q14 72 26 78 Q38 84 50 78 Q62 72 74 78 Q86 84 98 78" stroke="white" stroke-width="5"
                fill="none" stroke-linecap="round" />
              <path d="M2 90 Q14 84 26 90 Q38 96 50 90 Q62 84 74 90 Q86 96 98 90" stroke="white" stroke-width="5"
                fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <div class="logo-text">ULISSY <span>Drop</span></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
          <span class="toggle-icons"><span>🌙</span><span>☀️</span></span>
        </button>
      </div>
      <div class="tagline">Write or paste a long message. Share a short link with voice in 27+ languages.</div>
      <div class="field-label">Title</div>
      <input type="text" class="title-input" id="msgTitle" placeholder="e.g. Meeting notes for Monday">
      <div class="field-label" style="margin-top:20px">Message</div>
      <textarea id="msgBody" placeholder="Write or paste your message here...

Supports **bold** text and line breaks. Your reader gets automatic voice playback in 27+ languages."></textarea>
      <div class="char-count"><span id="charCount">0</span> chars</div>
      <button class="btn" id="generateBtn" onclick="generate()">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
        Generate Link
      </button>
      <div class="result" id="result">
        <div class="result-box">
          <div class="result-label">Your links</div>
          <div class="result-links">
            <div class="link-row">
              <span class="label">Short</span><span class="url" id="shortUrl"></span>
            </div>
            <div class="link-row">
              <span class="label">Full</span><span class="url long-url" id="fullUrl"></span>
            </div>
          </div>
          <div class="copy-row">
            <button class="btn-sm btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Short Link</button>
            <button class="btn-sm btn-wa" onclick="shareWhatsApp()">💬 WhatsApp</button>
          </div>
        </div>
        <div class="wa-preview">
          <div class="wa-preview-label">WhatsApp preview</div>
          <div class="wa-preview-text" id="waPreview"></div>
        </div>
      </div>
    </div>

    <!-- READ VIEW -->
    <div class="read-view" id="readView">
      <div class="header-row" style="margin-bottom:24px">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="M50 8 L50 55 L78 55 Q80 30 62 15 Q52 8 50 8Z" fill="white" />
              <rect x="48" y="2" width="4" height="56" fill="white" rx="2" />
              <path d="M12 58 Q8 58 12 64 L22 68 L78 68 L88 64 Q92 58 88 58 L12 58Z" fill="white" />
              <path d="M12 58 Q5 54 10 45 Q12 50 16 55" fill="white" />
              <path d="M2 78 Q14 72 26 78 Q38 84 50 78 Q62 72 74 78 Q86 84 98 78" stroke="white" stroke-width="5"
                fill="none" stroke-linecap="round" />
              <path d="M2 90 Q14 84 26 90 Q38 96 50 90 Q62 84 74 90 Q86 96 98 90" stroke="white" stroke-width="5"
                fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <div class="logo-text">ULISSY <span>Drop</span></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
          <span class="toggle-icons"><span>🌙</span><span>☀️</span></span>
        </button>
      </div>
      <div class="read-card">
        <div class="read-header">
          <div class="read-title" id="readTitle"></div>
          <div class="read-meta" id="readMeta"></div>
        </div>
        <div class="read-body" id="readBody"></div>
        <div class="read-player">
          <button class="btn-listen" id="listenBtn" onclick="toggleTTS()">
            <span id="listenIcon">🔊</span> <span id="listenLabel">Listen</span>
          </button>
          <div class="tts-progress" id="ttsProgress" style="display:none">
            <div class="tts-progress-bar" id="ttsBar"></div>
          </div>
          <button class="tts-speed" id="speedBtn" onclick="cycleSpeed()">1×</button>
        </div>
        <div class="read-likes">
          <button class="btn-like" id="likeBtn" onclick="toggleLike()">
            <span class="heart" id="likeHeart">🤍</span> <span id="likeLabel">Like</span>
          </button>
          <span class="like-count" id="likeCount"></span>
        </div>
        <div class="read-footer">Shared via <a onclick="goCompose()">Ulissy Drop</a> — send long messages as links</div>
      </div>
    </div>

  </div>

  <script>
    const VERSION = 1;

    // ─── Theme ──────────────────────────────────────────
    let currentTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
    }

    // ─── Encoding ───────────────────────────────────────
    function encodeMessage(title, body) {
      return LZString.compressToEncodedURIComponent(
        JSON.stringify({ v: VERSION, t: title, b: body, d: Date.now() })
      );
    }

    function decodeMessage(data) {
      try {
        const json = LZString.decompressFromEncodedURIComponent(data);
        if (!json) return null;
        return JSON.parse(json);
      } catch (e) { return null; }
    }

    function linkify(text) {
      var urlPattern = /(https?:\/\/[^\s<]+[^\s<.,;:!?"')\}\]])|(?<![\/@\w.])((?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+(?:com|org|app|io|it|html|net|dev|ai)(?:\/[^\s<]*[^\s<.,;:!?"')\}\]])?)/gi;
      return text.replace(urlPattern, function (match, fullUrl, bareUrl) {
        var href = fullUrl || ('https://' + bareUrl);
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + match + '</a>';
      });
    }

    function renderText(text) {
      var escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      escaped = linkify(escaped);
      return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    // ─── URL Shortener ──────────────────────────────────
    async function shortenUrl(longUrl) {
      // Try Ulissy Short first, then fallback to public services
      var services = [
        { url: 'https://s.ulissy.app/api/shorten', method: 'POST', body: JSON.stringify({ url: longUrl }), headers: { 'Content-Type': 'application/json' }, parse: (d) => d.url || ('https://s.ulissy.app/' + d.code) },
        { url: 'https://is.gd/create.php?format=json&url=' + encodeURIComponent(longUrl), method: 'GET', parse: (d) => d.shorturl },
        { url: 'https://v.gd/create.php?format=json&url=' + encodeURIComponent(longUrl), method: 'GET', parse: (d) => d.shorturl }
      ];
      for (var i = 0; i < services.length; i++) {
        try {
          var opts = { method: services[i].method };
          if (services[i].body) opts.body = services[i].body;
          if (services[i].headers) opts.headers = services[i].headers;
          var res = await fetch(services[i].url, opts);
          var data = await res.json();
          var short = services[i].parse(data);
          if (short) return short;
        } catch (e) { continue; }
      }
      return null;
    }

    // ─── Compose ────────────────────────────────────────
    var msgBody = document.getElementById('msgBody');
    var charCount = document.getElementById('charCount');
    msgBody.addEventListener('input', function () { charCount.textContent = msgBody.value.length; });

    var shareUrl = '';
    var fullUrl = '';

    async function generate() {
      var title = document.getElementById('msgTitle').value.trim();
      var body = msgBody.value.trim();
      if (!body) { msgBody.focus(); return; }

      document.getElementById('generateBtn').disabled = true;

      var hash = encodeMessage(title || 'Message', body);
      var base = 'https://drop.ulissy.app';
      fullUrl = base + '#' + hash;
      shareUrl = fullUrl;

      document.getElementById('fullUrl').textContent = fullUrl;
      document.getElementById('shortUrl').textContent = 'Shortening...';
      document.getElementById('shortUrl').className = 'url short-loading';
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      updateWaPreview(title, body, shareUrl);

      try {
        var short = await shortenUrl(fullUrl);
        if (short) {
          shareUrl = short;
          document.getElementById('shortUrl').textContent = short;
          document.getElementById('shortUrl').className = 'url';
          updateWaPreview(title, body, short);
        } else {
          shortenerFailed();
        }
      } catch (e) {
        shortenerFailed();
      }

      document.getElementById('generateBtn').disabled = false;
    }

    function shortenerFailed() {
      document.getElementById('shortUrl').textContent = 'Shortener unavailable — use full link';
      document.getElementById('shortUrl').className = 'url short-error';
      document.getElementById('copyBtn').textContent = '📋 Copy Full Link';
    }

    function updateWaPreview(title, body, url) {
      var displayTitle = title || 'Message';
      var preview = body.length > 140 ? body.substring(0, 140) + '…' : body;
      document.getElementById('waPreview').innerHTML =
        '📩 <strong>' + renderText(displayTitle) + '</strong>\n\n' +
        renderText(preview) + '\n\n' +
        '👉 <span class="wa-link">' + url + '</span>';
    }

    function copyLink() {
      navigator.clipboard.writeText(shareUrl).then(function () {
        var btn = document.getElementById('copyBtn');
        var orig = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(function () { btn.textContent = orig; }, 1500);
      });
    }

    function shareWhatsApp() {
      var title = document.getElementById('msgTitle').value.trim() || 'Message';
      var body = msgBody.value.trim();
      var preview = body.length > 140 ? body.substring(0, 140) + '…' : body;
      var text = '📩 *' + title + '*\n\n' + preview + '\n\n👉 ' + shareUrl;
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }

    // ─── TTS ────────────────────────────────────────────
    var ttsText = '';
    var ttsPlaying = false;
    var ttsSpeed = 1;
    var speeds = [1, 1.25, 1.5, 0.75];
    var speedIndex = 0;

    function detectLanguage(text) {
      var s = text.substring(0, 1200).toLowerCase();
      s = ' ' + s.replace(/[\u2018\u2019']/g, ' ').replace(/[^a-z\u00C0-\u024F\u0400-\u04FF\u0600-\u06FF\u0900-\u097F\u0E00-\u0E7F\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF\u0370-\u03FF\u0590-\u05FF\s]/g, ' ').replace(/\s+/g, ' ') + ' ';

      var patterns = [
        ['it-IT', / (che |il |la |lo |le |gli |del |dei |della |delle |con |una |uno |sono |come |per |non |questo |quello |anche |essere |hanno |stato |tutto |fare |dopo |ancora |suo |sua |ogni |alla |alle |nel |nei |nella |molto |quando |dove |tra |fra |senza |loro |questa |questi |quale |quali )/g],
        ['es-ES', / (que |el |la |los |las |del |una |con |para |por |como |pero |puede |tiene |esto |sobre |cuando |todos |entre |porque |desde |donde |antes |cada |muy |otro |sin |todo |esta |este |ese )/g],
        ['pt-BR', / (que |para |como |uma |com |por |mais |ele |ela |isso |pode |muito |ainda |aqui |foram |fazer |quando |cada |outro |todo |essa |esse |seu |sua )/g],
        ['fr-FR', / (que |est |pour |les |des |une |avec |dans |cette |sont |nous |vous |mais |tout |plus |leur |fait |aussi |qui |par |sur |pas |ont |elle |ces |aux )/g],
        ['de-DE', / (und |der |die |das |ist |mit |auf |ein |eine |nicht |sich |auch |wird |oder |nach |noch |bei |kann |aber |wenn |den |dem |des |von |aus |nur |wie |hat |sind )/g],
        ['nl-NL', / (het |een |van |dat |die |niet |zijn |voor |met |ook |maar |deze |werd |nog |wel |naar |zij |wat |bij |uit )/g],
        ['pl-PL', / (jest |nie |jak |ale |czy |tego |tak |tylko |bardzo |przez |przed |jeszcze )/g],
        ['ru-RU', /[\u0430-\u044f\u0451]{3,}/g],
        ['uk-UA', / (що |як |але |або |для |його |вона |цей |були |може |також )/g],
        ['ko-KR', /[\uac00-\ud7af]/g],
        ['ar-SA', /[\u0600-\u06ff]/g],
        ['hi-IN', /[\u0900-\u097f]/g],
        ['th-TH', /[\u0e00-\u0e7f]/g],
        ['vi-VN', /[\u00e0\u00e1\u1ea3\u00e3\u1ea1\u0103\u1eaf\u1eb1\u1eb5\u1eb7\u00e2\u1ea5\u1ea7\u1ea9\u1eab\u1ead\u00e8\u00e9\u1ebb\u1ebd\u1eb9\u00ea\u1ebf\u1ec1\u1ec3\u1ec5\u1ec7\u00ec\u00ed\u1ec9\u0129\u1ecb\u00f2\u00f3\u1ecf\u00f5\u1ecd\u00f4\u1ed1\u1ed3\u1ed5\u1ed7\u1ed9\u01a1\u1edb\u1edd\u1edf\u1ee1\u1ee3\u00f9\u00fa\u1ee7\u0169\u1ee5\u01b0\u1ee9\u1eeb\u1eed\u1eef\u1ef1\u1ef3\u00fd\u1ef7\u1ef9\u1ef5\u0111]/g],
        ['tr-TR', / (bir |bu |ile |olan |gibi |daha |sonra |kadar |olarak |ancak |ise |veya )/g],
        ['sv-SE', / (och |det |att |som |med |den |inte |har |var |kan |till |utan |efter |alla |mycket )/g],
        ['da-DK', / (og |det |at |som |for |med |den |ikke |har |var |fra |kan |til |efter |alle |meget )/g],
        ['nb-NO', / (og |det |som |for |med |ikke |har |kan |fra |til |etter |alle )/g],
        ['fi-FI', / (ja |on |ei |se |kun |niin |ole |oli |ovat |mutta |vain |nyt |kuin |joka )/g],
        ['el-GR', /[\u0370-\u03ff]/g],
        ['he-IL', /[\u0590-\u05ff]/g],
        ['ro-RO', / (este |sunt |care |din |sau |acest |pentru |mai |fost |prin |doar |fiind )/g],
        ['cs-CZ', / (jest |jsou |jako |ale |nebo |jeho |bylo |velmi )/g],
        ['hu-HU', / (egy |hogy |nem |van |volt |meg |csak |vagy |mint |lett |minden )/g],
        ['id-ID', / (yang |dan |dari |untuk |dengan |pada |adalah |ini |tidak |akan |juga |atau )/g]
      ];

      var best = 'en-US';
      var bestScore = 0;

      for (var i = 0; i < patterns.length; i++) {
        var matches = s.match(patterns[i][1]);
        var score = matches ? matches.length : 0;
        if (score > bestScore) {
          bestScore = score;
          best = patterns[i][0];
        }
      }

      var kanaMatches = s.match(/[\u3040-\u309f\u30a0-\u30ff]/g);
      var hanMatches = s.match(/[\u4e00-\u9fff]/g);
      var kanaCount = kanaMatches ? kanaMatches.length : 0;
      var hanCount = hanMatches ? hanMatches.length : 0;

      if (kanaCount > 0 && (kanaCount + hanCount) > bestScore) {
        best = 'ja-JP';
        bestScore = kanaCount + hanCount;
      } else if (hanCount > 0 && kanaCount === 0 && hanCount > bestScore) {
        best = 'zh-CN';
        bestScore = hanCount;
      }

      return bestScore >= 2 ? best : 'en-US';
    }

    function getBestVoice(lang) {
      var voices = speechSynthesis.getVoices();
      if (!voices.length) return null;
      var prefix = lang.substring(0, 2).toLowerCase();

      var langVoices = voices.filter(function (v) {
        var vl = (v.lang || '').replace('_', '-').toLowerCase();
        return vl === lang.toLowerCase() || vl.startsWith(prefix + '-') || vl === prefix;
      });

      if (langVoices.length > 0) {
        var scored = langVoices.map(function (v) {
          var score = 0;
          if (/enhanced|premium|natural|neural/i.test(v.name)) score += 100;
          if (/google|microsoft|siri/i.test(v.name)) score += 80;
          if (!v.localService) score += 50;
          if (/enhanced/i.test(v.name)) score += 40;
          if (/compact|basic/i.test(v.name)) score -= 50;
          return { voice: v, score: score };
        });
        scored.sort(function (a, b) { return b.score - a.score; });
        return scored[0].voice;
      }

      if (prefix !== 'en') {
        var enVoices = voices.filter(function (v) {
          var vl = (v.lang || '').replace('_', '-').toLowerCase();
          return vl.startsWith('en-') || vl === 'en';
        });
        if (enVoices.length > 0) {
          var enScored = enVoices.map(function (v) {
            var score = 0;
            if (/enhanced|premium|natural|neural/i.test(v.name)) score += 100;
            if (/google|microsoft|siri/i.test(v.name)) score += 80;
            if (!v.localService) score += 50;
            if (/enhanced/i.test(v.name)) score += 40;
            if (/compact|basic/i.test(v.name)) score -= 50;
            return { voice: v, score: score };
          });
          enScored.sort(function (a, b) { return b.score - a.score; });
          return enScored[0].voice;
        }
      }

      return null;
    }

    function toggleTTS() {
      if (ttsPlaying) {
        speechSynthesis.cancel();
        ttsPlaying = false;
        document.getElementById('ttsBar').style.width = '0%';
        document.getElementById('ttsProgress').style.display = 'none';
        updateTTSUI();
        return;
      }

      if (!ttsText) return;
      startSpeaking();
    }

    function startSpeaking() {
      speechSynthesis.cancel();
      var lang = detectLanguage(ttsText);
      var voice = getBestVoice(lang);

      var chunks = ttsText.match(/[^.!?。！？\n]+[.!?。！？\n]*/g) || [ttsText];

      var merged = [];
      var current = '';
      for (var i = 0; i < chunks.length; i++) {
        if ((current + chunks[i]).length > 200 && current.length > 0) {
          merged.push(current.trim());
          current = chunks[i];
        } else {
          current += chunks[i];
        }
      }
      if (current.trim()) merged.push(current.trim());

      var words = ttsText.split(/\s+/).length;
      var estimatedDuration = (words / 150) * 60 / ttsSpeed;
      var startTime = Date.now();
      var chunkIndex = 0;

      function speakNext() {
        if (chunkIndex >= merged.length) {
          ttsPlaying = false;
          document.getElementById('ttsBar').style.width = '100%';
          setTimeout(function () {
            document.getElementById('ttsBar').style.width = '0%';
            document.getElementById('ttsProgress').style.display = 'none';
            updateTTSUI();
          }, 500);
          return;
        }

        var utterance = new SpeechSynthesisUtterance(merged[chunkIndex]);
        utterance.lang = lang;
        utterance.rate = ttsSpeed;
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang;
        }

        utterance.onstart = function () {
          if (chunkIndex === 0) {
            ttsPlaying = true;
            document.getElementById('ttsProgress').style.display = 'block';
            updateTTSUI();
            updateProgress(startTime, estimatedDuration);
          }
        };

        utterance.onend = function () {
          chunkIndex++;
          if (ttsPlaying) speakNext();
        };

        utterance.onerror = function () {
          ttsPlaying = false;
          updateTTSUI();
        };

        speechSynthesis.speak(utterance);
      }

      speakNext();
    }

    function updateProgress(startTime, duration) {
      if (!ttsPlaying) return;
      var elapsed = (Date.now() - startTime) / 1000;
      var pct = Math.min((elapsed / duration) * 100, 95);
      document.getElementById('ttsBar').style.width = pct + '%';
      requestAnimationFrame(function () { updateProgress(startTime, duration); });
    }

    function updateTTSUI() {
      var btn = document.getElementById('listenBtn');
      var icon = document.getElementById('listenIcon');
      var label = document.getElementById('listenLabel');
      if (ttsPlaying) {
        btn.classList.add('playing');
        icon.textContent = '⏹';
        label.textContent = 'Stop';
      } else {
        btn.classList.remove('playing');
        icon.textContent = '🔊';
        label.textContent = 'Listen';
      }
    }

    function cycleSpeed() {
      speedIndex = (speedIndex + 1) % speeds.length;
      ttsSpeed = speeds[speedIndex];
      document.getElementById('speedBtn').textContent = ttsSpeed + '×';
      if (ttsPlaying) {
        speechSynthesis.cancel();
        ttsPlaying = false;
        toggleTTS();
      }
    }

    (function preloadVoices() {
      speechSynthesis.getVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = function () {
          speechSynthesis.getVoices();
        };
      }
      setTimeout(function () { speechSynthesis.getVoices(); }, 100);
      setTimeout(function () { speechSynthesis.getVoices(); }, 500);
    })();

    // ─── Likes ──────────────────────────────────────────
    var LIKES_API = ''; // Optional: add your Railway likes API

    var currentMsgHash = '';

    function hashMessage(str) {
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
        var c = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + c;
        hash |= 0;
      }
      return 'msg_' + Math.abs(hash).toString(36);
    }

    function isLikedLocally(hash) {
      try { return localStorage.getItem('like_' + hash) === '1'; } catch (e) { return false; }
    }

    function setLikedLocally(hash, liked) {
      try { localStorage.setItem('like_' + hash, liked ? '1' : '0'); } catch (e) { }
    }

    async function fetchLikeCount(hash) {
      if (!LIKES_API) return null;
      try {
        var res = await fetch(LIKES_API + '/likes/' + hash);
        var data = await res.json();
        return data.count || 0;
      } catch (e) { return null; }
    }

    async function sendLikeDelta(hash, delta) {
      if (!LIKES_API) return;
      try {
        await fetch(LIKES_API + '/likes/' + hash, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ delta: delta })
        });
      } catch (e) { }
    }

    async function toggleLike() {
      if (!currentMsgHash) return;
      var liked = isLikedLocally(currentMsgHash);
      var btn = document.getElementById('likeBtn');
      var heart = document.getElementById('likeHeart');
      var label = document.getElementById('likeLabel');

      if (liked) {
        setLikedLocally(currentMsgHash, false);
        btn.classList.remove('liked', 'heart-pop');
        heart.textContent = '🤍';
        label.textContent = 'Like';
        sendLikeDelta(currentMsgHash, -1);
        updateLikeDisplay(-1);
      } else {
        setLikedLocally(currentMsgHash, true);
        btn.classList.remove('heart-pop');
        void btn.offsetWidth;
        btn.classList.add('liked', 'heart-pop');
        heart.textContent = '❤️';
        label.textContent = 'Liked';
        sendLikeDelta(currentMsgHash, 1);
        updateLikeDisplay(1);
      }
    }

    var displayedCount = 0;

    function updateLikeDisplay(delta) {
      displayedCount = Math.max(0, displayedCount + (delta || 0));
      var el = document.getElementById('likeCount');
      if (displayedCount > 0) {
        el.textContent = displayedCount + (displayedCount === 1 ? ' like' : ' likes');
      } else {
        el.textContent = '';
      }
    }

    async function initLikes(msgText) {
      currentMsgHash = hashMessage(msgText);
      var liked = isLikedLocally(currentMsgHash);
      var btn = document.getElementById('likeBtn');
      var heart = document.getElementById('likeHeart');
      var label = document.getElementById('likeLabel');

      if (liked) {
        btn.classList.add('liked');
        heart.textContent = '❤️';
        label.textContent = 'Liked';
      }

      var count = await fetchLikeCount(currentMsgHash);
      if (count !== null) {
        displayedCount = count;
      } else {
        displayedCount = liked ? 1 : 0;
      }
      updateLikeDisplay(0);
    }

    // ─── Read Mode ──────────────────────────────────────
    function showRead(data) {
      document.getElementById('composeView').style.display = 'none';
      document.getElementById('readView').style.display = 'block';
      document.getElementById('readTitle').textContent = data.t;
      document.getElementById('readBody').innerHTML = renderText(data.b);
      ttsText = data.b.replace(/\*\*/g, '');

      initLikes(data.t + data.b);

      if (data.d) {
        var date = new Date(data.d);
        document.getElementById('readMeta').textContent =
          date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }

      document.title = data.t + ' — Ulissy Drop';
    }

    function goCompose() {
      history.pushState(null, '', window.location.pathname);
      document.getElementById('composeView').style.display = 'block';
      document.getElementById('readView').style.display = 'none';
      document.title = 'Ulissy Drop — Long Messages, One Tap';
    }

    // ─── Init ───────────────────────────────────────────
    function init() {
      var hash = window.location.hash.substring(1);
      if (hash) {
        var data = decodeMessage(hash);
        if (data) { showRead(data); return; }
      }
    }

    window.addEventListener('hashchange', init);
    init();
  </script>
</body>
